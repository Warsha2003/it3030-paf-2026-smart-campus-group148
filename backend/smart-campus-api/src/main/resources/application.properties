# ============================================================
#  Smart Campus API – Application Properties
# ============================================================

spring.application.name=smart-campus-api
server.port=8080

# ── Database (PostgreSQL) ──────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_campus_db
spring.datasource.username=postgres
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT Configuration ──────────────────────────────────────
app.jwt.secret=your-super-secret-jwt-key-must-be-at-least-256-bits-long-for-hs256
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ── OAuth2 / Google ────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile

# ── OAuth2 Redirect ────────────────────────────────────────
app.oauth2.authorized-redirect-uris=http://localhost:3000/oauth2/redirect

# ── CORS ───────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000

# ── File Upload (for ticket attachments) ───────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads

# ── Logging ────────────────────────────────────────────────
logging.level.com.smartcampus=DEBUG
logging.level.org.springframework.security=INFO